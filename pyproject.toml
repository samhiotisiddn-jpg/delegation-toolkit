[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalmesh"
version = "0.1.0"
description = "FractalMesh sovereign automation and orchestration toolkit."
requires-python = ">=3.10"
authors = [
  { name = "Samuel James Hiotis" }
]
keywords = ["ai", "automation", "crypto", "trading", "web3", "orchestration"]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "supabase>=2.4.0",
  "stripe>=9.0.0",
  "python-dotenv>=1.0.1",
  "feedparser>=6.0.11",
  "openai>=1.30.0",
  "httpx>=0.27.0",
  "ccxt>=4.3.0",
  "psutil>=6.0.0",
  "aiohttp>=3.9.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["fractalmesh*"]
