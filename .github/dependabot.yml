version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/fractalmesh"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/fractalmesh/orchestrator"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
