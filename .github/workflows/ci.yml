name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f fractalmesh/requirements.txt ]; then pip install -r fractalmesh/requirements.txt; fi
          if [ -f fractalmesh/orchestrator/requirements.txt ]; then pip install -r fractalmesh/orchestrator/requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install .; fi
          pip install ruff pytest

      - name: Run ruff
        run: |
          if find . -type f -name "*.py" | grep -q .; then
            ruff check .
          else
            echo "No Python files found; skipping ruff"
          fi

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests/ directory found; skipping pytest"
          fi
