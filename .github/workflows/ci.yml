name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          if [ -f fractalmesh/requirements.txt ]; then
            pip install -r fractalmesh/requirements.txt
          fi

      - name: Lint with ruff
        run: |
          if find . -name "*.py" -not -path "./.git/*" | grep -q .; then
            ruff check .
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "No tests directory found, skipping pytest."
          fi
